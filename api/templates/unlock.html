<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Canvas Course Exporter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#172036; --muted:#5B6478; --line:#DCE1EA; --accent:#2846C8; --accent-soft:#E8ECFB; --bad:#B42318; --bad-soft:#FDECEA; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #fff; color: var(--ink); font: 14px/1.5 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
         display: grid; place-items: center; padding: 24px; }
  .box { width: 100%; max-width: 380px; text-align: center; }
  .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; margin: 0 auto 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 28px; }
  .digits { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .digits input { width: 48px; height: 58px; text-align: center; font: 600 24px "IBM Plex Sans", system-ui, sans-serif;
                  border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: #fff; }
  .digits input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  button { width: 100%; height: 46px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
           font: 600 15px "IBM Plex Sans", system-ui, sans-serif; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 10px 12px; margin-top: 14px; }
  .hidden { display: none; }
  @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
</style>
</head>
<body>
  <form class="box" id="f" autocomplete="off">
    <div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
    <h1>Enter passcode</h1>
    <p>This exporter is private. Enter the 6-digit passcode to continue.</p>
    <div class="digits" id="digits">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 1" autofocus>
      <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 5">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 6">
    </div>
    <button id="go" type="submit" disabled>Unlock</button>
    <div class="error hidden" id="err" role="alert"></div>
  </form>
<script>
const boxes = [...document.querySelectorAll("#digits input")], go = document.getElementById("go"), err = document.getElementById("err");
const code = () => boxes.map(b => b.value).join("");
boxes.forEach((b, i) => {
  b.addEventListener("input", () => {
    b.value = b.value.replace(/\D/g, "").slice(-1);
    if (b.value && i < 5) boxes[i + 1].focus();
    go.disabled = code().length !== 6;
    if (code().length === 6) document.getElementById("f").requestSubmit();
  });
  b.addEventListener("keydown", e => { if (e.key === "Backspace" && !b.value && i > 0) boxes[i - 1].focus(); });
  b.addEventListener("paste", e => {
    const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
    if (!d) return; e.preventDefault();
    d.split("").forEach((ch, j) => boxes[j] && (boxes[j].value = ch));
    boxes[Math.min(d.length, 5)].focus(); go.disabled = code().length !== 6;
    if (code().length === 6) document.getElementById("f").requestSubmit();
  });
});
let busy = false;
document.getElementById("f").onsubmit = async e => {
  e.preventDefault(); if (busy || code().length !== 6) return; busy = true;
  go.disabled = true; go.textContent = "Checking"; err.classList.add("hidden");
  const r = await fetch("/unlock", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({code: code()})});
  if (r.ok) { location.reload(); return; }
  const d = await r.json().catch(() => ({}));
  err.textContent = d.error || "Wrong passcode."; err.classList.remove("hidden");
  const wrap = document.getElementById("digits"); wrap.classList.remove("shake"); void wrap.offsetWidth; wrap.classList.add("shake");
  boxes.forEach(b => b.value = ""); boxes[0].focus(); go.textContent = "Unlock"; go.disabled = true; busy = false;
};
</script>
</body>
</html>
